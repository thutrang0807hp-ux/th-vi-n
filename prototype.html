<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lofi Train — 3D Workspace</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#171d20;color:#f9f0e3;font-family:system-ui,Segoe UI,sans-serif}canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none}header{position:absolute;top:18px;left:22px;background:#211e1bba;border:1px solid #ffffff22;border-radius:18px;padding:12px 18px;backdrop-filter:blur(10px)}header a{display:inline-block;margin-top:7px;color:#ffe1af;pointer-events:auto}header b{font-size:17px}header small{display:block;color:#d9c4aa;margin-top:4px}#help{position:absolute;bottom:22px;left:22px;background:#211e1bd9;border-radius:16px;padding:13px 17px;font-size:13px;line-height:1.9}kbd{background:#ffffff24;border:1px solid #ffffff50;border-radius:5px;padding:2px 6px}#actions{position:absolute;right:20px;bottom:22px;display:flex;gap:9px;pointer-events:auto}button{background:#2c2925e8;color:#fff3e5;border:1px solid #ffffff44;padding:12px 15px;border-radius:12px;cursor:pointer;font-size:14px}button:hover{background:#5e4937}#status{position:absolute;top:20px;right:20px;background:#211e1bc9;padding:12px 15px;border-radius:13px;font-size:13px}#hint{position:absolute;left:50%;bottom:115px;transform:translateX(-50%);background:#241d19d9;padding:10px 16px;border-radius:12px;display:none}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#171d20;z-index:3;font-size:19px}#focus{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#211e1bea;border:1px solid #fff3;border-radius:22px;padding:26px;text-align:center;display:none;pointer-events:auto;min-width:250px}#clock{font-size:54px;font-weight:700;font-variant-numeric:tabular-nums}#focus button{margin:4px}@media(max-width:700px){#help{font-size:11px;bottom:80px}#actions{bottom:12px;right:10px;flex-wrap:wrap;justify-content:flex-end;max-width:65%}button{padding:9px}header{top:10px;left:10px}}</style></head><body><div id="loading">Đang dựng toa tàu 3D…</div><div id="ui"><header><b>🚂 Lofi Train — Mountain Route</b><small>Cozy 3D workspace · bản thử nghiệm</small><a href="index.html">Về toa lounge</a></header><div id="status">Camera: <span id="camlabel">Third-person</span> · <span id="loc">Toa ngắm cảnh</span></div><div id="help"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Di chuyển<br><kbd>Shift</kbd> Chạy · Kéo chuột Xoay camera<br>Cuộn chuột Zoom · <kbd>V</kbd> Đổi POV<br><kbd>E</kbd> Ngồi / Đứng · <kbd>F</kbd> Focus</div><div id="hint">Nhấn E để ngồi ngắm cảnh</div><div id="actions"><button id="cameraBtn">📷 Đổi camera</button><button id="seatBtn">🪑 Ngồi</button><button id="focusBtn">⏱ Focus</button></div><div id="focus"><div>Thời gian tập trung</div><div id="clock">25:00</div><button id="start">Bắt đầu</button><button id="reset">Đặt lại</button><button id="close">Đóng</button></div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';

const camera=new THREE.PerspectiveCamera(66,innerWidth/innerHeight,.08,240);const hemi=new THREE.HemisphereLight(0xdbe8ff,0x5b4032,2.0);scene.add(hemi);const sun=new THREE.DirectionalLight(0xffd9a6,2.3);sun.position.set(16,24,-20);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-25;sun.shadow.camera.right=25;sun.shadow.camera.top=35;sun.shadow.camera.bottom=-35;scene.add(sun);
const mat=(color,roughness=.8,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});const wood=mat('#72503a'),dark=mat('#443329'),trim=mat('#b99058',.45,.35),cream=mat('#cbbca5'),fabric=mat('#4c665d'),floor=mat('#8b674b'),pink=mat('#f2a7ae',.63),eye=mat('#19171a',.2),white=mat('#fff8ed'),glass=mat('#a2c6d2',.2,.15);
function box(w,h,d,m,x,y,z,parent=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}function ball(r,m,x,y,z,parent=scene,sx=1,sy=1,sz=1){const o=new THREE.Mesh(new THREE.SphereGeometry(r,20,14),m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;parent.add(o);return o}function rounded(w,h,d,r,m,x,y,z,parent=scene){const shape=new THREE.Shape();shape.moveTo(-w/2+r,-h/2);shape.lineTo(w/2-r,-h/2);shape.quadraticCurveTo(w/2,-h/2,w/2,-h/2+r);shape.lineTo(w/2,h/2-r);shape.quadraticCurveTo(w/2,h/2,w/2-r,h/2);shape.lineTo(-w/2+r,h/2);shape.quadraticCurveTo(-w/2,h/2,-w/2,h/2-r);shape.lineTo(-w/2,-h/2+r);shape.quadraticCurveTo(-w/2,-h/2,-w/2+r,-h/2);const geo=new THREE.ExtrudeGeometry(shape,{depth:d,bevelEnabled:true,bevelThickness:r*.35,bevelSize:r*.35,bevelSegments:3,curveSegments:4});geo.translate(0,0,-d/2);const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
// Oversized train carriage: 8m wide x 35m long, tall enough for camera movement.
box(8,.3,36,floor,0,-.18,0);box(8,.25,36,cream,0,5.45,0);for(let x of [-3.95,3.95]){box(.22,1.05,36,wood,x,.48,0);box(.25,1.0,36,wood,x,4.95,0);for(let z=-17;z<=17;z+=4.5){box(.3,3.65,.42,dark,x,2.75,z);box(.36,.18,4.2,trim,x,4.36,z+2.1);box(.34,.16,4.2,trim,x,1.05,z+2.1);}}for(let z=-17;z<=17;z+=4.5){box(8,.15,.28,dark,0,5.28,z);const light=new THREE.PointLight(0xffcf88,11,8,2);light.position.set(0,4.9,z);scene.add(light);ball(.22,mat('#ffe4aa'),0,5.05,z)}for(let z of [-18,18]){box(8,5.5,.35,wood,0,2.6,z);rounded(1.9,3.4,.1,.25,dark,0,2.15,z+(z>0?-.23:.23));}

// Bench clusters, tables, lamps, books, rugs.
for(let z=-14;z<=14;z+=5.7){for(let side of [-1,1]){const x=side*2.6;rounded(1.9,.5,2.1,.18,fabric,x,.62,z);rounded(.36,1.5,2.2,.13,fabric,x+side*.85,1.25,z);rounded(1.95,.28,.3,.1,dark,x,1.05,z-1);rounded(1.95,.28,.3,.1,dark,x,1.05,z+1);box(.9,.09,1.35,wood,side*.95,1.15,z);box(.11,1.15,.11,trim,side*.95,.55,z);ball(.13,mat('#ffe0a0'),side*.95,1.48,z);box(.08,.5,.08,trim,side*.95,1.35,z);for(let k=0;k<3;k++)box(.26,.08,.36,mat(['#a8886b','#9faaa2','#b69c84'][k]),side*.95+.2*k,1.23,z+.38);}}
box(1.8,.04,35,mat('#8b3d43'),0,.01,0);for(let z=-17;z<18;z+=1.5)box(1.6,.012,.06,trim,0,.04,z);

const mountain=mat('#748b86'),snow=mat('#e3e8df'),hill=mat('#5d806c'),pine=mat('#466653');function cone(r,h,m,x,y,z){const o=new THREE.Mesh(new THREE.ConeGeometry(r,h,5),m);o.position.set(x,y,z);o.rotation.y=Math.random()*3;o.receiveShadow=true;scene.add(o)}for(let i=0;i<48;i++){const z=-100+i*4.7;const side=i%2?1:-1;cone(8+(i%5)*3,22+(i%7)*4,mountain,side*(52+i%4*9),5,z);cone(3.7,5,snow,side*(52+i%4*9),20+(i%7)*2,z)}for(let i=0;i<190;i++){const x=(i%2?1:-1)*(9+(i*17%40));const z=-110+(i*31%220);cone(1.4+(i%4)*.45,5+(i%5),pine,x,1.5,z)}box(220,.2,240,hill,0,-4,0);box(18,.025,230,mat('#7fa8a9',.28),36,-3.8,0);const skySun=ball(5,mat('#f9d4a4'),65,40,-90);
// Mascot, pink block body, chunky limbs, large rounded head.
const avatar=new THREE.Group();scene.add(avatar);rounded(.85,.95,.64,.18,pink,0,1.06,0,avatar);rounded(1.24,1.18,.85,.2,pink,0,2.02,0,avatar);for(let s of [-1,1]){ball(.28,pink,s*.64,1.08,0,avatar,.9,1.3,.95);ball(.28,pink,s*.27,.38,0,avatar,1.1,1.35,1.25);ball(.19,white,s*.32,2.14,.47,avatar,1,1,.4);ball(.13,eye,s*.32,2.14,.59,avatar,1,1,.45)}ball(.12,mat('#e37d80'),0,1.9,.5,avatar);const smile=ball(.17,mat('#7f3943'),0,1.72,.49,avatar,1,.5,.25);avatar.position.set(0,0,12);
let yaw=0,pitch=.17,dist=5.4,pov=false,seated=false,focusOpen=false;const keys={};let walk=0;const camLabel=document.getElementById('camlabel');function toggleCam(){pov=!pov;camLabel.textContent=pov?'POV / First-person':'Third-person'}document.getElementById('cameraBtn').onclick=toggleCam;function toggleSeat(){seated=!seated;document.getElementById('seatBtn').textContent=seated?'🚶 Đứng':'🪑 Ngồi';if(seated){avatar.position.set(1.4,0,10.2);yaw=-Math.PI/2}else{avatar.position.set(0,0,10.2)}}document.getElementById('seatBtn').onclick=toggleSeat;let timer=1500,running=false,lastTimer=performance.now();function renderClock(){let m=Math.floor(timer/60),s=Math.floor(timer%60);document.getElementById('clock').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}function toggleFocus(){focusOpen=!focusOpen;document.getElementById('focus').style.display=focusOpen?'block':'none'}document.getElementById('focusBtn').onclick=toggleFocus;document.getElementById('close').onclick=toggleFocus;document.getElementById('start').onclick=()=>{running=!running;document.getElementById('start').textContent=running?'Tạm dừng':'Bắt đầu'};document.getElementById('reset').onclick=()=>{running=false;timer=1500;renderClock();document.getElementById('start').textContent='Bắt đầu'};

const clock=new THREE.Clock();const target=new THREE.Vector3();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);const now=performance.now();if(running){timer=Math.max(0,timer-(now-lastTimer)/1000);if(timer===0)running=false;renderClock()}lastTimer=now;let dx=Number(!!keys.KeyD)-Number(!!keys.KeyA),dz=Number(!!keys.KeyS)-Number(!!keys.KeyW);if(!seated&&(dx||dz)){const l=Math.hypot(dx,dz);dx/=l;dz/=l;const speed=keys.ShiftLeft?6.5:3.5;const fx=Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=Math.sin(yaw);avatar.position.x=THREE.MathUtils.clamp(avatar.position.x+(fx*-dz+rx*dx)*speed*dt,-2.75,2.75);avatar.position.z=THREE.MathUtils.clamp(avatar.position.z+(fz*-dz+rz*dx)*speed*dt,-16.6,16.6);avatar.rotation.y=Math.atan2(fx*-dz+rx*dx,fz*-dz+rz*dx);walk+=dt*11;avatar.position.y=Math.abs(Math.sin(walk))*.065}else{avatar.position.y=THREE.MathUtils.lerp(avatar.position.y,0,.2)}avatar.scale.y=THREE.MathUtils.lerp(avatar.scale.y,seated?.76:1,.13);target.set(avatar.position.x,avatar.position.y+(seated?1.65:1.65),avatar.position.z);if(pov){camera.position.copy(target);camera.position.add(new THREE.Vector3(Math.sin(yaw)*.25,.4,-Math.cos(yaw)*.25));camera.lookAt(camera.position.x+Math.sin(yaw)*10,camera.position.y-Math.tan(pitch)*10,camera.position.z-Math.cos(yaw)*10);avatar.visible=false}else{avatar.visible=true;const cp=new THREE.Vector3(target.x+Math.sin(yaw)*dist*Math.cos(pitch),target.y+1.0+Math.sin(pitch)*dist,target.z-Math.cos(yaw)*dist*Math.cos(pitch));camera.position.lerp(cp,.13);camera.lookAt(target)}document.getElementById('hint').style.display=Math.abs(avatar.position.z-10.2)<2.5?'block':'none';renderer.render(scene,camera)}document.getElementById('loading').remove();animate();
