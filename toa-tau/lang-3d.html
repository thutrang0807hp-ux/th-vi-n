<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lofi Train — Mountain Route</title>
  <link rel="stylesheet" href="../lounge.css?v=3d-village">
</head>
<body>
  <main aria-label="Toa lounge Lofi Train">
    <div id="scene"></div>
    <p id="status" role="status">Đang dựng toa tàu…</p>
    <header>
      <span>Lofi Train <span class="route">— Mountain Route</span></span>
      <div class="view-controls">
        <button id="motion-toggle" type="button">Dừng tàu</button>
        <button id="camera-toggle" type="button" aria-pressed="false">Camera POV</button>
      </div>
    </header>
    <div class="actions" aria-label="Điều khiển">
      <button id="seat-toggle" type="button" aria-pressed="false">Ngồi</button>
      <button id="focus-toggle" type="button" aria-haspopup="dialog">Focus</button>
    </div>
    <p class="keyboard-help">W A S D di chuyển · Shift chạy · Kéo chuột để xoay · Cuộn để zoom · Nhấp đúp hoặc V đổi camera · E ngồi · F Focus</p>
    <div class="touch-controls" aria-label="Di chuyển">
      <button type="button" data-key="KeyW" aria-label="Tiến">↑</button>
      <button type="button" data-key="KeyA" aria-label="Trái">←</button>
      <button type="button" data-key="KeyS" aria-label="Lùi">↓</button>
      <button type="button" data-key="KeyD" aria-label="Phải">→</button>
    </div>
    <dialog id="focus-panel" aria-labelledby="focus-title">
      <h2 id="focus-title">Đồng hồ Focus</h2>
      <output id="focus-clock" role="timer">25:00</output>
      <div class="timer-actions">
        <button id="timer-start" type="button">Bắt đầu</button>
        <button id="timer-reset" type="button">Đặt lại</button>
        <form method="dialog"><button>Đóng</button></form>
      </div>
    </dialog>
  </main>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js"}}</script>
  <script type="module" src="../village-scene.js"></script>
</body>
</html>
