<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lofi Train — Thung lũng Tulip</title>
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="../lounge.css?v=avatar">
</head>
<body>
  <main aria-label="Toa lounge Lofi Train">
    <div id="scene"></div>
    <div id="status" role="status">
      <p id="load-message">Đang dựng toa tàu…</p>
      <img id="scene-preview" alt="Ảnh xem trước toa tàu Lofi Train qua cánh đồng tulip" hidden>
    </div>
    <header>
      <span>Lofi Train <span class="route">— Thung lũng Tulip</span></span>
      <div class="view-controls">
        <select id="route-picker" aria-label="Chọn phong cảnh">
          <option value="tulip">Thung lũng Tulip</option>
          <option value="tri-ton">Mùa vàng Tri Tôn</option>
          <option value="ocean">Bờ biển xanh</option>
          <option value="iceland">Iceland · Hồ băng cực quang</option>
        </select>
        <button id="motion-toggle" type="button">Dừng tàu</button>
        <button id="avatar-toggle" type="button" aria-haspopup="dialog" disabled>Nhân vật</button>
        <button id="camera-toggle" type="button" aria-pressed="false">Camera POV</button>
      </div>
    </header>
    <details class="bay-lamp-controls">
      <summary>Đèn bàn</summary>
      <div class="bay-lamp-settings">
        <label><input id="bay-lamp-switch" type="checkbox" checked> Bật đèn</label>
        <label for="bay-lamp-level">Độ sáng</label>
        <input id="bay-lamp-level" type="range" min="0" max="100" value="42" aria-label="Độ sáng đèn bàn">
      </div>
    </details>
    <button id="seat-hint" type="button" hidden><kbd>E</kbd> Ngồi</button>
    <div class="actions" aria-label="Điều khiển">
      <select id="activity-picker" aria-label="Hoạt động của nhân vật" disabled>
        <option value="idle">Hoạt động</option>
        <option value="read">Đọc sách</option>
        <option value="write">Viết ghi chú</option>
        <option value="work">Làm việc với laptop</option>
        <option value="plan">Lập kế hoạch</option>
        <option value="think">Suy nghĩ</option>
        <option value="tea">Uống trà</option>
      </select>
      <button id="seat-toggle" type="button" aria-pressed="false">Ngồi</button>
      <button id="focus-toggle" type="button" aria-haspopup="dialog">Focus</button>
    </div>
    <p class="keyboard-help">W A S D di chuyển · Shift chạy · Kéo chuột để xoay · Cuộn để zoom · Nhấp đúp hoặc V đổi camera · E ngồi · F Focus</p>
    <div class="touch-controls" aria-label="Di chuyển">
      <button type="button" data-key="KeyW" aria-label="Tiến">↑</button>
      <button type="button" data-key="KeyA" aria-label="Trái">←</button>
      <button type="button" data-key="KeyS" aria-label="Lùi">↓</button>
      <button type="button" data-key="KeyD" aria-label="Phải">→</button>
    </div>
    <dialog id="avatar-panel" aria-labelledby="avatar-title">
      <h2 id="avatar-title">Tùy chỉnh nhân vật</h2>
      <div class="avatar-preview" aria-hidden="true"></div>
      <div class="avatar-options">
        <label>Màu nhân vật
          <select name="color">
            <option value="peach">Hồng đào</option>
            <option value="cream">Kem</option>
            <option value="lilac">Tím nhạt</option>
            <option value="sky">Xanh trời</option>
            <option value="mint">Xanh bạc hà</option>
          </select>
        </label>
        <label>Phụ kiện
          <select name="accessory">
            <option value="pilot">Bộ phi công</option>
            <option value="cap">Mũ phi công</option>
            <option value="scarf">Khăn đỏ</option>
            <option value="satchel">Túi da</option>
            <option value="headphones">Tai nghe</option>
            <option value="plain">Cơ bản</option>
          </select>
        </label>
        <label>Biểu cảm
          <select name="expression">
            <option value="gentle">Dịu dàng</option>
            <option value="happy">Vui vẻ</option>
            <option value="sleepy">Buồn ngủ</option>
            <option value="surprised">Ngạc nhiên</option>
          </select>
        </label>
      </div>
      <form method="dialog"><button>Đóng</button></form>
    </dialog>
    <dialog id="focus-panel" aria-labelledby="focus-title">
      <h2 id="focus-title">Đồng hồ Focus</h2>
      <output id="focus-clock" role="timer">25:00</output>
      <div class="timer-actions">
        <button id="timer-start" type="button">Bắt đầu</button>
        <button id="timer-reset" type="button">Đặt lại</button>
        <form method="dialog"><button>Đóng</button></form>
      </div>
    </dialog>
  </main>
  <script type="module">
    const picker = document.querySelector('#route-picker');
    const route = new URLSearchParams(location.search).get('scene');
    const scene = ['tri-ton', 'ocean', 'iceland'].includes(route) ? route : 'tulip';
    picker.value = scene;
    picker.addEventListener('change', () => {
      const next = new URL(location.href);
      if (picker.value !== 'tulip') next.searchParams.set('scene', picker.value);
      else next.searchParams.delete('scene');
      location.assign(next);
    });
    window.addEventListener('pageshow', () => { picker.value = scene; });

    try {
      const { start } = await import('../village-scene.js?v=avatar');
      if (scene === 'tri-ton') {
        const { buildTriTon } = await import('../tri-ton-scene.js');
        document.querySelector('.route').textContent = '— Mùa vàng Tri Tôn';
        await start({ buildExterior: buildTriTon });
      } else if (scene === 'ocean') {
        const { buildOceanCoast } = await import('../ocean-coast.js');
        document.querySelector('.route').textContent = '— Bờ biển xanh';
        await start({ buildExterior: buildOceanCoast });
      } else if (scene === 'iceland') {
        const { buildIcelandAurora } = await import('../iceland-aurora.js');
        document.querySelector('.route').textContent = '— Hồ băng Iceland';
        await start({ buildExterior: buildIcelandAurora });
      } else {
        await start();
      }
    } catch (error) {
      const preview = document.querySelector('#scene-preview');
      document.querySelector('#load-message').textContent =
        'Không mở được chế độ 3D trên trình duyệt này. Đây là ảnh xem trước của toa tàu.';
      if (scene === 'iceland') {
        preview.alt = 'Ảnh xem trước hồ băng cực quang qua cửa sổ toa tàu';
        preview.src = '../assets/iceland-preview.webp';
      } else if (scene === 'ocean') {
        preview.alt = 'Ảnh xem trước biển xanh qua cửa sổ toa tàu';
        preview.src = '../assets/ocean-coast-preview.webp';
      } else {
        preview.src = '../assets/tulip-train-preview.webp?v=pastel-stream';
      }
      preview.hidden = false;
      console.error(error);
    }
  </script>
</body>
</html>
