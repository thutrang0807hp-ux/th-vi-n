<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script><script type="module">

for(let z=-12;z<=12;z+=2.4){const p=[];for(let i=0;i<=20;i++){let x=-4.5+i*.45;p.push([x,5.02+.75*(1-(x/4.5)**2),z])}tube(p,.06,M.trim)}
for(let z=-10;z<=10;z+=4){cylinder(.22,.22,.13,M.brass,0,5.7,z);ball(.32,M.cream,0,5.42,z,1,.6,1);let light=new T.PointLight(0xffc894,15,9,2);light.position.set(0,5.2,z);scene.add(light)}
for(let z of [-13,13]){box(9,5.25,.32,M.dark,0,2.4,z);soft(2.1,3.3,.1,.3,M.trim,0,2,z+(z>0?-.23:.23));soft(1.85,3.05,.11,.24,M.wood,0,2,z+(z>0?-.32:.32));ball(.09,M.brass,.72,2,z+(z>0?-.42:.42))}
// Booths: padded seats, cushions, brass legs, tables and shaded lamps.
for(let z of [-8,-3,2,7])for(let side of [-1,1]){const x=side*2.95;
soft(2.45,.48,2.55,.23,M.seat,x,.58,z);soft(.48,1.6,2.65,.2,M.seat,x+side*1.04,1.28,z);
for(let dz of [-1.07,1.07]){soft(2.35,.32,.35,.13,M.dark,x,1.0,z+dz);ball(.1,M.brass,x-side*.7,.25,z+dz)}

for(let j=0;j<4;j++)ball(.035,M.trim,x+side*1.04,1.0+j*.28,z,.7,.7,.7);

for(let k=0;k<3;k++)add(new T.ConeGeometry((1.3+k*.5)*h/6,h*.43,7),i%3?M.pine:M.pine2,x,-3.9+k*h*.2,z,exterior)}

 const bounds=new T.Box3().setFromObject(model),size=bounds.getSize(new T.Vector3());
 const scale=1.55/Math.max(size.x,size.z,0.001);model.scale.setScalar(scale);

document.getElementById('focusBtn').onclick=toggleFocus;document.getElementById('close').onclick=toggleFocus;document.getElementById('start').onclick=()=>{running=!running;document.getElementById('start').textContent=running?'Tạm dừng':'Bắt đầu'};document.getElementById('reset').onclick=()=>{running=false;timer=1500;document.getElementById('start').textContent='Bắt đầu'};

if(running){timer=Math.max(0,timer-dt);if(!timer)running=false;document.getElementById('digits').textContent=String(Math.floor(timer/60)).padStart(2,'0')+':'+String(Math.floor(timer%60)).padStart(2,'0')}
let x=Number(!!keys.KeyD)-Number(!!keys.KeyA),z=Number(!!keys.KeyS)-Number(!!keys.KeyW);if(!sitting&&(x||z)){let l=Math.hypot(x,z);x/=l;z/=l;let speed=keys.ShiftLeft?5.5:3.1,mx=-z*Math.sin(yaw)+x*Math.cos(yaw),mz=z*Math.cos(yaw)+x*Math.sin(yaw);
