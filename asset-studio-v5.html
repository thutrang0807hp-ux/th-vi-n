<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lofi Train — Asset Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#1a1a1a;color:#f7ead8;font:14px system-ui;overflow:hidden}canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none}.p{background:#241c19c9;backdrop-filter:blur(14px);border:1px solid #ffffff30;border-radius:15px;padding:12px 15px}#head{position:absolute;top:18px;left:18px}#head b{font-size:17px}#head small{display:block;color:#d9c3aa;margin-top:5px}#state{position:absolute;top:18px;right:18px}#help{position:absolute;bottom:18px;left:18px;line-height:1.9}#buttons{position:absolute;bottom:18px;right:18px;pointer-events:auto;display:flex;gap:8px}button{border:1px solid #fff5;border-radius:10px;background:#3a2923;color:#fff;padding:12px;cursor:pointer}#focus{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:none;text-align:center;pointer-events:auto}#digits{font-size:46px}#error{position:absolute;top:75px;right:18px;max-width:330px;color:#ffdbbc}@media(max-width:650px){#help{font-size:11px;bottom:75px}#buttons{bottom:10px;right:8px}button{padding:8px}#state{top:78px}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script></head><body><div id="ui"><div class="p" id="head"><b>🚂 Lofi Train · Asset Studio</b><small>V5 · Bố cục mới · GLB thật</small></div><div class="p" id="state">Đang tải nội thất…</div><div id="error"></div><div class="p" id="help">WASD di chuyển · Shift chạy<br>Kéo chuột xoay · Cuộn zoom<br>V chuyển POV · E ngồi · F Focus</div><div id="buttons"><button id="cam">📷 POV</button><button id="sit">🪑 Ngồi</button><button id="timer">⏱ Focus</button></div><div class="p" id="focus">Tập trung<div id="digits">25:00</div><button id="start">Bắt đầu</button><button id="reset">Đặt lại</button><button id="close">Đóng</button></div></div><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const scene=new T.Scene();scene.background=new T.Color('#a9bdc1');scene.fog=new T.Fog('#a9bdc1',65,220);
const r=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,1.8));r.shadowMap.enabled=true;r.shadowMap.type=T.PCFSoftShadowMap;r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1.35;document.body.appendChild(r.domElement);
const cam=new T.PerspectiveCamera(64,innerWidth/innerHeight,.1,260);scene.add(new T.HemisphereLight('#e8edff','#564332',2.0));const sun=new T.DirectionalLight('#ffcb91',3.5);sun.position.set(-20,24,-25);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-30,right:30,top:30,bottom:-30});scene.add(sun);
const mat=(c,r=.8,m=0)=>new T.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const M={wood:mat('#78503a'),dark:mat('#3d2821'),brass:mat('#c99a5e',.3,.7),cream:mat('#d9c4a5'),rug:mat('#7a3e43'),green:mat('#36564c'),pink:mat('#efa3b4',.4),white:mat('#fff5e9'),black:mat('#241b22'),hill:mat('#6c8a79'),mount:mat('#819a96'),snow:mat('#dbe8e5'),pine:mat('#416b5a'),water:mat('#7aa8af')};
function add(g,m,x=0,y=0,z=0,p=scene){const o=new T.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;p.add(o);return o}
function box(w,h,d,m,x,y,z,p){return add(new T.BoxGeometry(w,h,d),m,x,y,z,p)}
function ball(rad,m,x,y,z,sx=1,sy=1,sz=1,p=scene){const o=add(new T.SphereGeometry(rad,24,16),m,x,y,z,p);o.scale.set(sx,sy,sz);return o}
function soft(w,h,d,rad,m,x,y,z,p=scene){const s=new T.Shape();s.moveTo(-w/2+rad,-h/2);s.lineTo(w/2-rad,-h/2);s.quadraticCurveTo(w/2,-h/2,w/2,-h/2+rad);s.lineTo(w/2,h/2-rad);s.quadraticCurveTo(w/2,h/2,w/2-rad,h/2);s.lineTo(-w/2+rad,h/2);s.quadraticCurveTo(-w/2,h/2,-w/2,h/2-rad);s.lineTo(-w/2,-h/2+rad);s.quadraticCurveTo(-w/2,-h/2,-w/2+rad,-h/2);const g=new T.ExtrudeGeometry(s,{depth:d,bevelEnabled:true,bevelSize:rad*.35,bevelThickness:rad*.35,bevelSegments:4});g.translate(0,0,-d/2);return add(g,m,x,y,z,p)}
// New layout: short gallery car, large viewing windows, fewer furniture pieces.
box(8,.22,19,M.wood,0,-.15,0);box(1.9,.025,18.3,M.rug,0,.015,0);
for(const side of [-1,1]){let x=side*3.94;box(.23,1.2,19,M.wood,x,.48,0);box(.3,.78,19,M.wood,x,4.55,0);box(.12,.12,19,M.brass,x,1.05,0);for(let z=-9;z<=9;z+=4.5){box(.32,3.1,.34,M.dark,x,2.6,z);box(.14,.1,4.1,M.brass,x,4.15,z+2.2);}}
for(let z=-9.4;z<=9.4;z+=.8){const verts=[],indices=[];for(let i=0;i<=20;i++){const x=-4+i*.4,y=4.9+.75*(1-(x/4)**2);verts.push(x,y,z,x,y,z+.8)}for(let i=0;i<20;i++){const a=i*2;indices.push(a,a+1,a+2,a+1,a+3,a+2)}const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(verts,3));g.setIndex(indices);g.computeVertexNormals();add(g,new T.MeshStandardMaterial({color:'#b8a18b',roughness:.9,side:T.DoubleSide}))}
for(let z=-8;z<=8;z+=4){ball(.3,M.cream,0,5.12,z,1,.6,1);const l=new T.PointLight('#ffd09b',13,8,2);l.position.set(0,4.9,z);scene.add(l)}
for(let z of [-9.5,9.5]){box(8,5.1,.3,M.dark,0,2.4,z);soft(2,3.2,.14,.24,M.brass,0,1.9,z+(z>0?-.2:.2));soft(1.7,2.9,.14,.2,M.wood,0,1.9,z+(z>0?-.31:.31))}
// Sparse accent tables, no cloned blocky bench rows.
for(let z of [-5,2,6])for(let side of [-1,1]){const x=side*2.2;soft(.8,.12,1.2,.1,M.wood,x,1.05,z);box(.1,1,.1,M.brass,x,.52,z);ball(.17,M.cream,x,1.38,z,1,.65,1)}
const outside=new T.Group();scene.add(outside);box(240,.2,300,M.hill,0,-5,0,outside);
for(let side of [-1,1]){box(20,.12,300,M.water,side*24,-4.8,0,outside);for(let i=0;i<26;i++){let z=-130+i*10,x=side*(45+i%5*9),h=16+i%7*4;add(new T.ConeGeometry(10+i%3*3,h,8),M.mount,x,h/2-5,z,outside);add(new T.ConeGeometry(3.5,h*.22,8),M.snow,x,h*.88-5,z,outside)}for(let i=0;i<100;i++){let z=-130+i*23%260,x=side*(10+i*11%30);add(new T.ConeGeometry(1.5+i%3*.4,5+i%4,8),M.pine,x,-1,z,outside)}}
const avatar=new T.Group();scene.add(avatar);soft(.85,.92,.7,.22,M.pink,0,1,0,avatar);soft(1.35,1.3,1,.3,M.pink,0,1.97,0,avatar);for(const s of [-1,1]){ball(.28,M.pink,s*.67,1.06,0,.9,1.3,1,avatar);ball(.3,M.pink,s*.27,.32,0,1,1.1,1.2,avatar);ball(.18,M.white,s*.32,2.07,.55,1,1,.5,avatar);ball(.12,M.black,s*.32,2.07,.66,1,1,.5,avatar)}ball(.12,M.black,0,1.7,.58,1,.4,.3,avatar);avatar.position.z=6;
// Authored glTF chair, reused as distinct scene instances. Failure is explicit.
const status=document.getElementById('state'),error=document.getElementById('error');const loader=new GLTFLoader();
const url='https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/SheenChair/glTF-Binary/SheenChair.glb';
loader.load(url,({scene:chair})=>{const b=new T.Box3().setFromObject(chair),sz=b.getSize(new T.Vector3()),scale=1.7/Math.max(sz.x,sz.z);chair.scale.setScalar(scale);chair.updateMatrixWorld(true);const bounds=new T.Box3().setFromObject(chair),ctr=bounds.getCenter(new T.Vector3());for(const z of [-5,2,6])for(const side of [-1,1]){const o=chair.clone(true);o.position.set(side*3.1-ctr.x,.08-bounds.min.y,z-ctr.z);o.rotation.y=side===1?-Math.PI/2:Math.PI/2;o.traverse(c=>{if(c.isMesh){c.castShadow=true;c.receiveShadow=true}});scene.add(o)}status.textContent='✓ Đã tải GLB: SheenChair × 6';},undefined,e=>{status.textContent='⚠ GLB tải thất bại';error.textContent='Không tải được nội thất GLB. Kiểm tra mạng hoặc Console.';console.error(e)});
let yaw=0,pitch=.15,dist=5.5,pov=false,seated=false,drag=false,px=0,py=0;const keys={};
function toggleCam(){pov=!pov;document.getElementById('cam').textContent=pov?'📷 Theo sau':'📷 POV'}
function toggleSit(){seated=!seated;document.getElementById('sit').textContent=seated?'🚶 Đứng':'🪑 Ngồi';avatar.position.set(seated?2.9:0,0,5)}
document.getElementById('cam').onclick=toggleCam;document.getElementById('sit').onclick=toggleSit;
window.addEventListener('keydown',e=>{keys[e.code]=true;if(['KeyW','KeyA','KeyS','KeyD'].includes(e.code))e.preventDefault();if(e.repeat)return;if(e.code==='KeyV')toggleCam();if(e.code==='KeyE')toggleSit();if(e.code==='KeyF')toggleFocus()});window.addEventListener('keyup',e=>keys[e.code]=false);
r.domElement.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY});window.addEventListener('pointerup',()=>drag=false);window.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-px)*.005;pitch=T.MathUtils.clamp(pitch+(e.clientY-py)*.004,-.6,1);px=e.clientX;py=e.clientY});r.domElement.addEventListener('wheel',e=>{dist=T.MathUtils.clamp(dist+e.deltaY*.008,2.5,10)},{passive:true});window.addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
let seconds=1500,running=false,opened=false;function toggleFocus(){opened=!opened;document.getElementById('focus').style.display=opened?'block':'none'}document.getElementById('timer').onclick=toggleFocus;document.getElementById('close').onclick=toggleFocus;document.getElementById('start').onclick=()=>{running=!running;document.getElementById('start').textContent=running?'Tạm dừng':'Bắt đầu'};document.getElementById('reset').onclick=()=>{seconds=1500;running=false};const clock=new T.Clock(),target=new T.Vector3();
function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);outside.position.z=(outside.position.z+dt*.5)%10;if(running){seconds=Math.max(0,seconds-dt);if(!seconds)running=false;document.getElementById('digits').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(Math.floor(seconds%60)).padStart(2,'0')}
let x=Number(!!keys.KeyD)-Number(!!keys.KeyA),z=Number(!!keys.KeyS)-Number(!!keys.KeyW);if(!seated&&(x||z)){let l=Math.hypot(x,z);x/=l;z/=l;let speed=keys.ShiftLeft?5.5:3,mx=-z*Math.sin(yaw)+x*Math.cos(yaw),mz=z*Math.cos(yaw)+x*Math.sin(yaw);avatar.position.x=T.MathUtils.clamp(avatar.position.x+mx*speed*dt,-2.8,2.8);avatar.position.z=T.MathUtils.clamp(avatar.position.z+mz*speed*dt,-7.7,7.7);avatar.rotation.y=Math.atan2(mx,mz)}
avatar.scale.y=T.MathUtils.lerp(avatar.scale.y,seated?.75:1,.1);target.set(avatar.position.x,avatar.position.y+1.65,avatar.position.z);if(pov){avatar.visible=false;cam.position.copy(target);cam.position.y+=.4;cam.lookAt(cam.position.x+Math.sin(yaw)*10,cam.position.y-Math.tan(pitch)*10,cam.position.z-Math.cos(yaw)*10)}else{avatar.visible=true;cam.position.lerp(new T.Vector3(target.x+Math.sin(yaw)*dist*Math.cos(pitch),target.y+1+Math.sin(pitch)*dist,target.z-Math.cos(yaw)*dist*Math.cos(pitch)),.14);cam.lookAt(target)}r.render(scene,cam)}frame();
</script></body></html>
